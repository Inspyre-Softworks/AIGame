[project]
name = "aigame"
version = "0.1.0"
description = "Narrative political simulation MVP"
authors = [
    {name = "Taylor B. | Inspyre-Softworks"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic>=2.13.4,<3.0.0"
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
aigame = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
